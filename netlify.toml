[build]
  base = ".antigravity/frontend"
  command = "node scripts/check-deployment.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_PUBLIC_DEMO = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
