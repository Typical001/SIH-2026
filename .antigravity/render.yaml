services:
  - type: web
    name: polarnav-backend
    runtime: python
    plan: free
    rootDir: .antigravity
    buildCommand: "pip install -r backend/requirements-deploy.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_DEMO
        value: "true"
      - key: ROUTE_CACHE_SIZE
        value: "4"
